name: Build Thaumic Storage Scanning

on:
  push:
    branches:
      - thaumic-storage-scanning-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 25 compilation toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Use Java 21 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build against exact runtime APIs
        working-directory: tools/thaumic-storage-scanning
        run: |
          java -version
          echo "Java 25 toolchain: $JAVA_HOME_25_X64"
          gradle -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64" --no-daemon clean build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: thaumic-storage-scanning-0.1.2
          path: tools/thaumic-storage-scanning/build/libs/*.jar
          if-no-files-found: error
