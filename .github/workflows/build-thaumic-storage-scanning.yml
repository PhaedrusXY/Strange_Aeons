name: Build Thaumic Storage Scanning

on:
  push:
    branches:
      - thaumic-storage-scanning-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build against exact runtime APIs
        working-directory: tools/thaumic-storage-scanning
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: thaumic-storage-scanning-0.1.2
          path: tools/thaumic-storage-scanning/build/libs/*.jar
          if-no-files-found: error
